[project]
name = "bhumi-ai-real-estate-scraper"
version = "0.1.0"
description = "Dynamic real estate builder website crawler and archival engine."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "playwright>=1.45.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "httpx>=0.27.0",
  "gspread>=6.1.0",
  "google-auth>=2.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
